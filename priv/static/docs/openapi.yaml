components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
      description: 'Pass Authorization: Bearer <api_token> in the HTTP Authorization
        header'
  parameters:
    PageNum:
      name: page_num
      in: query
      description: Zero-based page number (default 0)
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: page_size
      in: query
      description: Page size (default 10, max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdNested:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: User id or username; "current" allowed in some routes
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhoneNumberId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddressId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResetToken:
      name: token
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized (not admin/owner)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            code: 401
            detail: Unauthorized
            message: You are authenticated but do not have access to this method on
              this object.
    Forbidden:
      description: Forbidden or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            code: 403
            detail: Forbidden
            message: Anonymous access to this method on this object is not allowed.  You
              must authenticate and pass a valid token.
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            code: 404
            detail: Not Found
            message: The requested object was not found.
    Conflict:
      description: Conflict with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            code: 409
            detail: Conflict
            message: The request conflicts with the current state of the resource.
    InvalidMfaCode:
      description: The supplied MFA code was invalid, expired, or already used
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            code: 403
            detail: Forbidden
            message: The multi-factor authentication code was invalid or expired.  Re-submit
              with a current totp_code.
            mfa_required: true
            invalid_mfa_code: true
            mfa_types:
            - totp
            errors:
            - totp_code:
              - invalid
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorWithDetails'
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            code: 429
            detail: Too Many Requests
            message: You have exceeded the allowed number of requests.  Please cool
              off and try again later.
    SessionRevokedOrExpired:
      description: Session revoked or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            ok: false
            code: 403
            detail: Forbidden
            message: Session cannot be extended.  It is expired or revoked
            errors:
            - session:
              - 'revoked_or_expired: true'
  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
    Error:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        code:
          type: integer
        detail:
          type: string
        message:
          type: string
        errors:
          type: array
          items:
            type: object
        token_expired:
          type: boolean
        token_revoked:
          type: boolean
        mfa_required:
          type: boolean
        invalid_mfa_code:
          type: boolean
        mfa_types:
          type: array
          items:
            type: string
      required:
      - ok
      - code
      - detail
      - message
    ErrorWithDetails:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        properties:
          errors:
            type: object
    UserResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/User'
    UserFullResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/UserFull'
    UsersPageResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        code:
          type: integer
          example: 200
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page_num:
          type: integer
        page_size:
          type: integer
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: string
          format: date-time
          nullable: true
        totp_enabled:
          type: boolean
          description: True when TOTP multi-factor authentication is enabled (a
            confirmed enrollment exists)
