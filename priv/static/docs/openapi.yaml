openapi: 3.1.0
info:
  title: Malan Accounts API
  description: 'REST API for the Malan (Ameelio Accounts) service. Paths are derived
    from

    `lib/malan_web/router.ex` as of December 23, 2025. Most responses share a

    common envelope `{ok, code, data}`. Authenticated routes expect an

    `Authorization: Bearer <token>` header containing an API token issued by

    `POST /api/sessions`.

    '
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Malan Team
servers:
- url: /
  description: Same origin (matches host serving Swagger UI)
- url: https://accounts.ameelio.org
  description: Production
- url: https://accounts.ameelio.xyz
  description: Staging
- url: http://localhost:4000
  description: Local development
security:
- bearerAuth: []
tags:
- name: Health
- name: Auth
- name: Users
- name: Sessions
- name: Session Extensions
- name: Addresses
- name: Phone Numbers
- name: MFA
- name: Logs
- name: Admin
paths:
  /health_check/liveness:
    get:
      tags:
      - Health
      summary: Liveness probe
      responses:
        '200':
          description: Service is running
      operationId: get_health_check_liveness
      description: Liveness probe
  /health_check/readiness:
    get:
      tags:
      - Health
      summary: Readiness probe
      responses:
        '200':
          description: Service is ready
      operationId: get_health_check_readiness
      description: Readiness probe
  /api/users:
    post:
      tags:
      - Users
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
            example:
              user:
                email: some@email.com
                username: someusername
                password: Sup3rSecret!
                first_name: Some
                last_name: User
                nick_name: CoolCat
                preferences:
                  theme: light
                  display_name_pref: nick_name
                addresses: []
                phone_numbers: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          $ref: '#/components/responses/Unprocessable'
          description: Unprocessable Entity
      operationId: post_api_users
      description: Register a new user
  /api/users/whoami:
    get:
      tags:
      - Auth
      summary: Validate API token and return session info
      description: Requires a bearer token even though it is on the unauthenticated
        pipeline.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmIResponse'
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Forbidden
      operationId: get_api_users_whoami
  /api/users/me:
    get:
      tags:
      - Users
      summary: Get current user (deprecated)
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Forbidden
      operationId: get_api_users_me
      description: Get current user (deprecated)
  /api/users/current:
    get:
      tags:
      - Users
      summary: Get current user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Forbidden
      operationId: get_api_users_current
      description: Get current user
  /api/users/{id}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Users
      summary: Get user by id or username
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFullResponse'
          description: OK
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not Found
      operationId: get_api_users_by_id
      description: Get user by id or username
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
      - Users
      summary: Update a user (self or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: OK
        '422':
          $ref: '#/components/responses/Unprocessable'
          description: Unprocessable Entity
      operationId: put_api_users_by_id
      description: Update a user (self or admin)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
      - Users
      summary: Delete (anonymize) user
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not Found
      operationId: delete_api_users_by_id
      description: Delete (anonymize) user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/users/{id}/reset_password:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Users
      summary: Request password reset email for user
      security: []
      responses:
        '200':
          description: Reset email enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Too Many Requests
      operationId: post_api_users_by_id_reset_password
      description: Request password reset email for user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/users/{id}/reset_password/{token}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    - $ref: '#/components/parameters/ResetToken'
    put:
      tags:
      - Users
      summary: Complete password reset with token (id + token variant)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetWithTokenRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Unauthorized
      operationId: put_api_users_by_id_reset_password_by_token
      description: Complete password reset with token (id + token variant)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: path
        required: true
        schema:
          type: string
  /api/users/reset_password/{token}:
    parameters:
    - $ref: '#/components/parameters/ResetToken'
    put:
      tags:
      - Users
      summary: Complete password reset with token (no id)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetWithTokenRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Unauthorized
      operationId: put_api_users_reset_password_by_token
      description: Complete password reset with token (no id)
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
  /api/users/{id}/verify_email:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Users
      summary: Request or resend an email verification email (authenticated)
      responses:
        '200':
          description: Verification email enqueued or no-op success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationRequestResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Forbidden
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Too Many Requests
      operationId: post_api_users_by_id_verify_email
      description: Request or resend an email verification email.  Authenticated only.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/users/{id}/verify_email/{token}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    - name: token
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - Users
      summary: Verify email with token (id + token variant)
      security: []
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Unauthorized
      operationId: put_api_users_by_id_verify_email_by_token
      description: Verify email with token (id + token variant)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: path
        required: true
        schema:
          type: string
  /api/users/verify_email/{token}:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    put:
      tags:
      - Users
      summary: Verify email with token (no id)
      security: []
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Unauthorized
      operationId: put_api_users_verify_email_by_token
      description: Verify email with token (no id)
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
  /api/sessions:
    post:
      tags:
      - Auth
      summary: Create session (log in)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
            example:
              session:
                username: someusername
                password: Sup3rSecret!
                location: nyc-lab
                valid_only_for_ip: false
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Created
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Too Many Requests (login rate limit exceeded)
        '403':
          description: 'Forbidden: invalid credentials, or MFA is enabled and no
            code / an invalid code was supplied. Branch on the machine-readable
            body flags: mfa_required (re-submit credentials with a totp_code) and
            invalid_mfa_code (the code sent was rejected).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_credentials:
                  value:
                    ok: false
                    code: 403
                    detail: Forbidden
                    message: Username, password and/or location were invalid.  Please
                      verify credentials and try again.
                mfa_required:
                  value:
                    ok: false
                    code: 403
                    detail: Forbidden
                    message: Multi-factor authentication is required.  Re-submit
                      credentials with a valid totp_code.
                    mfa_required: true
                    mfa_types:
                    - totp
                    errors:
                    - totp_code:
                      - required
                invalid_mfa_code:
                  value:
                    ok: false
                    code: 403
                    detail: Forbidden
                    message: The multi-factor authentication code was invalid or
                      expired.  Re-submit with a current totp_code.
                    mfa_required: true
                    invalid_mfa_code: true
                    mfa_types:
                    - totp
                    errors:
                    - totp_code:
                      - invalid
        '423':
          description: User locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: post_api_sessions
      description: 'Create session (log in). Users with TOTP MFA enabled must also
        supply totp_code (a 6-digit authenticator code or a 12-character backup
        code) — see the 403 body flags mfa_required / invalid_mfa_code.'
  /api/sessions/active:
    get:
      tags:
      - Sessions
      summary: List active sessions for current user
      parameters:
      - $ref: '#/components/parameters/PageNum'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
          description: OK
      operationId: get_api_sessions_active
      description: List active sessions for current user
  /api/sessions/current:
    get:
      tags:
      - Sessions
      summary: Get current session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
        '403':
          $ref: '#/components/responses/Forbidden'
          description: Forbidden
      operationId: get_api_sessions_current
      description: Get current session
    delete:
      tags:
      - Sessions
      summary: Revoke current session
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
      operationId: delete_api_sessions_current
      description: Revoke current session
  /api/sessions/current/extend:
    put:
      tags:
      - Sessions
      summary: Extend current session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExtendRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
        '403':
          $ref: '#/components/responses/SessionRevokedOrExpired'
          description: Forbidden
      operationId: put_api_sessions_current_extend
      description: Extend current session
  /api/session_extensions/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Session Extensions
      summary: Get a session extension record
      description: Get a session extension record (owner or admin only)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExtensionResponse'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Unauthorized (only owner or admin may view)
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not Found
      operationId: get_api_session_extensions_by_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/sessions/{session_id}/extensions:
    parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - $ref: '#/components/parameters/PageNum'
    - $ref: '#/components/parameters/PageSize'
    get:
      tags:
      - Session Extensions
      summary: List extensions for a session (newest first)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExtensionsResponse'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Unauthorized (only owner or admin may view)
        '404':
          $ref: '#/components/responses/NotFound'
          description: Not Found
      operationId: get_api_sessions_by_session_id_extensions
      description: List extensions for a session (owner or admin only). Results are ordered by newest first.
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/sessions:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    get:
      tags:
      - Sessions
      summary: List sessions for user (owner or admin)
      parameters:
      - $ref: '#/components/parameters/PageNum'
      - $ref: '#/components/parameters/PageSize'
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
          description: OK
      operationId: get_api_users_by_user_id_sessions
      description: List sessions for user (owner or admin)
    delete:
      tags:
      - Sessions
      summary: Revoke all active sessions for user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDeleteAllResponse'
          description: OK
      operationId: delete_api_users_by_user_id_sessions
      description: Revoke all active sessions for user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/sessions/active:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    - $ref: '#/components/parameters/PageNum'
    - $ref: '#/components/parameters/PageSize'
    get:
      tags:
      - Sessions
      summary: List active sessions for user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
          description: OK
      operationId: get_api_users_by_user_id_sessions_active
      description: List active sessions for user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/sessions/current/extend:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    put:
      tags:
      - Sessions
      summary: Extend current session (owner/admin)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExtendRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
        '403':
          $ref: '#/components/responses/SessionRevokedOrExpired'
          description: Forbidden
      operationId: put_api_users_by_user_id_sessions_current_extend
      description: Extend current session (owner/admin)
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/sessions/{id}:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    - $ref: '#/components/parameters/SessionId'
    get:
      tags:
      - Sessions
      summary: Get session for user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
      operationId: get_api_users_by_user_id_sessions_by_id
      description: Get session for user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
      - Sessions
      summary: Revoke session for user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
      operationId: delete_api_users_by_user_id_sessions_by_id
      description: Revoke session for user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
      - Sessions
      summary: Extend a specific session for user
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionExtendRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: OK
        '403':
          $ref: '#/components/responses/SessionRevokedOrExpired'
          description: Forbidden
      operationId: put_api_users_by_user_id_sessions_by_id
      description: Extend a specific session for user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/phone_numbers:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    get:
      tags:
      - Phone Numbers
      summary: List phone numbers for user
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumbersResponse'
          description: OK
      operationId: get_api_users_by_user_id_phone_numbers
      description: List phone numbers for user
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
      - Phone Numbers
      summary: Add phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberResponse'
          description: Created
      operationId: post_api_users_by_user_id_phone_numbers
      description: Add phone number
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/phone_numbers/{id}:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    - $ref: '#/components/parameters/PhoneNumberId'
    get:
      tags:
      - Phone Numbers
      summary: Get phone number
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberResponse'
          description: OK
      operationId: get_api_users_by_user_id_phone_numbers_by_id
      description: Get phone number
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      tags:
      - Phone Numbers
      summary: Update phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneNumberUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneNumberResponse'
          description: OK
      operationId: put_api_users_by_user_id_phone_numbers_by_id
      description: Update phone number
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
      - Phone Numbers
      summary: Delete phone number
      responses:
        '204':
          description: Deleted
      operationId: delete_api_users_by_user_id_phone_numbers_by_id
      description: Delete phone number
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/addresses:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    get:
      tags:
      - Addresses
      summary: List addresses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressesResponse'
          description: OK
      operationId: get_api_users_by_user_id_addresses
      description: List addresses
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
      - Addresses
      summary: Add address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponse'
          description: Created
      operationId: post_api_users_by_user_id_addresses
      description: Add address
      parameters:
      - name: user_id
