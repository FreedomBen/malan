  /api/users/{user_id}/totp:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    get:
      tags:
      - MFA
      summary: Get TOTP MFA status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpStatusResponse'
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Unauthorized
      operationId: get_api_users_by_user_id_totp
      description: 'TOTP MFA status for the user: none, pending, or enabled, plus
        the number of unused backup codes. Never returns the secret, otpauth URI,
        or QR code — only the password-gated enrollment POST discloses those.'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
      - MFA
      summary: Start TOTP enrollment (requires current password)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnrollRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnrollmentResponse'
          description: Created — provisioning payload disclosed exactly once
        '403':
          description: Wrong password, or email address not yet verified (both use
            the generic error shape with a specific message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
          description: TOTP is already enabled
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Too Many Requests
      operationId: post_api_users_by_user_id_totp
      description: 'Start TOTP enrollment. Requires the current password and a
        verified email address. Replaces any pending (unconfirmed) enrollment; the
        enrollment is inert until confirmed. The secret, otpauth URI, and QR SVG
        are returned once and cannot be re-read.'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/totp/confirm:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    put:
      tags:
      - MFA
      summary: Confirm TOTP enrollment with an authenticator code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpBackupCodesResponse'
          description: OK — backup codes shown once, never retrievable again
        '403':
          $ref: '#/components/responses/InvalidMfaCode'
          description: Invalid code
        '404':
          $ref: '#/components/responses/NotFound'
          description: No pending enrollment
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Too Many Requests
      operationId: put_api_users_by_user_id_totp_confirm
      description: 'Confirm a pending enrollment by proving possession of the
        authenticator. On success TOTP is enforced at login, backup codes are
        generated (returned once), and all other sessions are revoked — the
        session making this request stays valid.'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/totp/disable:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    post:
      tags:
      - MFA
      summary: Disable TOTP (requires password + code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpStatusResponse'
          description: OK — post-disable status (none)
        '403':
          description: Wrong password (generic error shape) or invalid code (body
            carries invalid_mfa_code true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
          description: TOTP is not enabled
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Too Many Requests
      operationId: post_api_users_by_user_id_totp_disable
      description: 'Disable TOTP. Requires the current password and a valid TOTP
        or backup code, so a stolen bearer token cannot silently strip MFA.
        Deletes the enrollment and all backup codes and revokes all other
        sessions (the current one stays valid). POST rather than DELETE because
        the request needs a body.'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
  /api/users/{user_id}/totp/backup_codes:
    parameters:
    - $ref: '#/components/parameters/UserIdNested'
    post:
      tags:
      - MFA
      summary: Regenerate backup codes (requires password + code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpDisableRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpBackupCodesResponse'
          description: OK — fresh set shown once; the old set is invalidated
        '403':
          description: Wrong password (generic error shape) or invalid code (body
            carries invalid_mfa_code true)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
          description: TOTP is not enabled
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: Too Many Requests
      operationId: post_api_users_by_user_id_totp_backup_codes
      description: 'Invalidate the entire backup-code set and mint a fresh one.
        Requires the current password and a valid TOTP or backup code.'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
