---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: malan
    tier: migration
    env: prod
    kind: configmap
  name: malan-migration-config
  namespace: malan-prod
data:
  BIND_ADDR: '127.0.0.1'
  POOL_SIZE: '5'
  DB_POOL_SIZE: '5'
  # Migrations run through the rw pooler and MUST use TLS — CNPG's pg_hba rejects
  # non-TLS (hostnossl reject). verify-full matches the web deployment;
  # malan-pg-migrate-secrets supplies the CA path + host.
  DATABASE_SSL_MODE: 'verify_full'
  # NOTE: like HAMMER_REDIS_URL and SECRET_KEY_BASE, TOTP_ENCRYPTION_KEYS must be
  # present in malan-migration-secrets — config/runtime.exs evaluates on any
  # :prod boot (including `eval "Malan.Release.migrate()"`) and refuses to
  # boot without it.
